  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],

            pablo: {
              bg: '#FAF6F2',

  <style>
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #18181B;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* Hide scrollbars inside mobile container */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Smooth screen transitions */
    .screen-fade {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Bottom Sheet Slide Up */
    .sheet-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    /* Map grid pattern matching screenshots 11 & Location */
    .map-grid-bg {
      background-color: #FBF9F6;
      background-image: 
        linear-gradient(to right, #FBF9F6 14px, transparent 14px),
        linear-gradient(to bottom, #FBF9F6 14px, transparent 14px);
    }
    /* Polka dot background for Pablo Logo Circle */
    .pablo-dots {
      background-color: #ffffff;
      background-image: radial-gradient(#1E1E1E 1.3px, transparent 1.3px);
      background-size: 8px 8px;
    }
    /* Mobile full screen adaptation */
    @media (max-width: 500px) {
      .phone-wrapper {
        padding: 0 !important;
      }
      .phone-frame {
        width: 100vw !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start">

    // --- Reusable Pablo Mascot Logo Badge (Exact match to UI) ---
    function getPabloLogoHTML(sizeClass = "w-28 h-28") {
      return `

    // --- Reusable Back Button (`>`) on Right ---
    function getBackButtonHTML(targetScreen = null) {
      const clickHandler = targetScreen ? `goToScreen('${targetScreen}')` : `goBack()`;
      return `
        <button onclick="${clickHandler}" class="w-11 h-11 rounded-full bg-white border border-pablo-border flex items-center justify-center text-pablo-text shadow-sm active:scale-95 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      `;
    }

    // --- Reusable Green Promo Banner ("كومبو بابلو") ---
    function getPromoBannerHTML() {
      return `
        <div onclick="openMealDetails(1)" class="cursor-pointer relative w-full rounded-[24px] bg-gradient-to-l from-[#A8E042] to-[#93CE2B] p-4 flex items-center justify-between overflow-hidden shadow-sm active:scale-[0.99] transition">

          <div class="z-10 flex flex-col items-start text-right pr-1">
            <h3 class="text-[24px] font-black text-pablo-greenDark leading-tight">كومبو بابلو</h3>

          <!-- Burger + Fries + Drink Composition (Left in RTL) -->

    // --- Toast Helper ---
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2200);
    }

    // --- Demo Bar Helpers ---
    function toggleDemoBar() {
      const bar = document.getElementById('demoBar');
      const showBtn = document.getElementById('showDemoBarBtn');
      if (bar.classList.contains('hidden')) {
        bar.classList.remove('hidden');
        showBtn.classList.add('hidden');
      } else {
        bar.classList.add('hidden');
        showBtn.classList.remove('hidden');
      }
    }

    function toggleGuestMode() {
      state.isGuest = !state.isGuest;
      updateUserModeButton();
      renderScreen();
      showToast(state.isGuest ? 'تم التفعيل: وضع التصفح كضيف' : 'تم التفعيل: وضع المستخدم المسجل');
    }

    function updateUserModeButton() {
      const btn = document.getElementById('userModeBtn');
      if (!btn) return;
      if (state.isGuest) {
        btn.textContent = 'الحالة: ضيف (اضغط للتبديل لـ مسجل دخول)';
        btn.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition';
      } else {
        btn.textContent = 'الحالة: مسجل دخول (اضغط للتبديل لـ ضيف)';
        btn.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30 transition';
      }
    }

    // --- Navigation Engine ---
    let splashTimeout = null;
    function goToScreen(screenName) {
      clearTimeout(splashTimeout);
      if (screenName === 'cart_guest_modal') {
        state.previousScreen = state.currentScreen;
        state.currentScreen = 'cart';
        state.showGuestLoginModal = true;
      } else {
        state.showGuestLoginModal = false;
        if (state.currentScreen !== screenName) {
          state.previousScreen = state.currentScreen;
        }
        state.currentScreen = screenName;
      }

      const select = document.getElementById('screenSelect');
      if (select) {
        select.value = state.showGuestLoginModal ? 'cart_guest_modal' : screenName;
      }

      renderScreen();
    }

    function goBack() {
      const fallbackMap = {
        'login': 'splash',
        'signup': 'login',
        'menu': 'home',
        'search': 'home',
        'details': 'menu',
        'cart': 'home',
        'checkout': 'cart',
        'tracking': 'orders',
        'location': 'home'
      };
      const target = fallbackMap[state.currentScreen] || state.previousScreen || 'home';
      goToScreen(target);
    }

    function openMealDetails(productId) {
      state.selectedMealId = productId || 1;
      state.mealSize = 'single';
      state.mealAddons = { cheese: true, fries: false, sauce: false };
      state.mealQty = 1;
      goToScreen('details');
    }

    function toggleFavorite(productId, event) {
      if (event) event.stopPropagation();
      const prod = state.products.find(p => p.id === productId);
      if (prod) {
        prod.fav = !prod.fav;
        showToast(prod.fav ? `تمت إضافة "${prod.name}" للمفضلة ❤️` : `تمت إزالة "${prod.name}" من المفضلة`);
        renderScreen();
      }
    }

    function quickAddToCart(productId, event) {
      if (event) event.stopPropagation();
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const existing = state.cart.find(item => item.id === prod.id);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({
          id: prod.id,
          name: prod.name,
          subtitle: 'سنجل',
          price: prod.singlePrice,
          qty: 1,
          image: prod.image
        });
      }
      showToast(`تمت إضافة ${prod.name} إلى سلتك 🛒`);
      renderScreen();
    }

    // 8. شاشة ٧ - تفاصيل الوجبة (Meal Details Screen)
    function calculateMealTotal(prod) {
      const base = state.mealSize === 'single' ? prod.singlePrice : prod.doublePrice;
      let addons = 0;
      if (state.mealAddons.cheese) addons += 10;
      if (state.mealAddons.fries) addons += 25;
      if (state.mealAddons.sauce) addons += 5;
      return (base + addons) * state.mealQty;
    }

    function addConfiguredMealToCart() {
      const prod = state.products.find(p => p.id === state.selectedMealId) || state.products[0];
      const totalUnit = calculateMealTotal(prod) / state.mealQty;
      const parts = [state.mealSize === 'single' ? 'سنجل' : 'دبل'];
      if (state.mealAddons.cheese) parts.push('جبنة زيادة');
      if (state.mealAddons.fries) parts.push('بطاطس');
      if (state.mealAddons.sauce) parts.push('صوص بابلو');

      state.cart.unshift({
        id: Date.now(),
        name: prod.name,
        subtitle: parts.join(' • '),
        price: totalUnit,
        qty: state.mealQty,
        image: prod.image
      });
      showToast('تمت إضافة الوجبة للسلة بنجاح!');
      goToScreen('cart');
    }

      return state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function updateCartQty(idx, delta) {
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) {
        state.cart.splice(idx, 1);
      }
      renderScreen();
    }

    function removeCartItem(idx) {
      state.cart.splice(idx, 1);
      renderScreen();
    }

    function handleProceedToCheckout() {
      if (state.isGuest) {
        state.showGuestLoginModal = true;
        renderScreen();
      } else {
        goToScreen('checkout');
      }
    }

    // --- Master Render Function ---
    function renderScreen() {
      const container = document.getElementById('screenContainer');
      const bottomNav = document.getElementById('bottomNav');

      // Screens that display the Bottom Navigation Bar
      const navScreens = ['home', 'menu', 'orders', 'favorites', 'offers', 'account'];
      if (navScreens.includes(state.currentScreen)) {
        bottomNav.classList.remove('hidden');
        // Update active state on bottom nav
        ['home', 'orders', 'favorites', 'offers', 'account'].forEach(tab => {
          const el = document.getElementById('nav-' + tab);
          if (!el) return;
          const isCurrent = (state.currentScreen === tab) || (state.currentScreen === 'menu' && tab === 'home');
          el.className = `flex flex-col items-center gap-1 flex-1 transition ${isCurrent ? 'text-pablo-red font-bold' : 'text-pablo-muted font-medium'}`;
        });
      } else {
        bottomNav.classList.add('hidden');
      }

      // Render current screen HTML
      switch (state.currentScreen) {
        case 'splash':
          container.innerHTML = renderSplashScreen();
          break;
        case 'login':
          container.innerHTML = renderLoginScreen();
          break;
        case 'signup':
          container.innerHTML = renderSignUpScreen();
          break;
        case 'account_created':
          container.innerHTML = renderAccountCreatedScreen();
          break;
        case 'home':
          container.innerHTML = renderHomeScreen();
          break;
        case 'menu':
          container.innerHTML = renderMenuScreen();
          break;
        case 'search':
          container.innerHTML = renderSearchScreen();
          break;
        case 'details':
          container.innerHTML = renderMealDetailsScreen();
          break;
        case 'cart':
          container.innerHTML = renderCartScreen();
          break;
        case 'checkout':
          container.innerHTML = renderCheckoutScreen();
          break;
        case 'order_confirmed':
          container.innerHTML = renderOrderConfirmedScreen();
          break;
        case 'tracking':
          container.innerHTML = renderTrackingScreen();
          break;
        case 'orders':
          container.innerHTML = renderOrdersScreen();
          break;
        case 'favorites':
          container.innerHTML = renderFavoritesScreen();
          break;
        case 'offers':
          container.innerHTML = renderOffersScreen();
          break;
        case 'account':
          container.innerHTML = renderAccountScreen();
          break;
        case 'location':
          container.innerHTML = renderLocationScreen();
          break;
        default:
          container.innerHTML = renderHomeScreen();
      }
      container.scrollTop = 0;
    }

    // Initialize App on Load
    window.onload = function () {
      updateUserModeButton();
      renderScreen();
    };
